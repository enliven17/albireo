services:
  db:
    platform: linux/arm64
    image: albireo-postgres:17.12-security1
    build:
      context: ../..
      dockerfile: infra/images/postgres.Dockerfile
    environment:
      POSTGRES_USER: stacklab
      POSTGRES_PASSWORD: disposable-stacklab-password
      POSTGRES_DB: stacklab
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U stacklab -d stacklab"]
      interval: 1s
      retries: 60
  queue:
    platform: linux/arm64
    image: albireo-elasticmq:1.7.1-security1
    build:
      context: ../..
      dockerfile: infra/images/elasticmq.Dockerfile
  umami:
    platform: linux/arm64
    image: albireo-umami:3.5.0-security1
    build:
      context: ../..
      dockerfile: infra/images/umami.Dockerfile
    environment:
      DATABASE_URL: postgresql://stacklab:disposable-stacklab-password@db:5432/stacklab
      APP_SECRET: disposable-upstream-identity-fixture
      TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      SALT_ROTATION: daily
      TZ: UTC
    ports:
      - "127.0.0.1:33529:3000"
  lab:
    platform: linux/arm64
    image: albireo-stack-lab:26
    build:
      context: .
      args:
        NODE_IMAGE: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    environment:
      DATABASE_URL: postgresql://stacklab:disposable-stacklab-password@db:5432/stacklab
      SQS_ENDPOINT: http://queue:9324
      UMAMI_URL: http://umami:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:43329:8080"
    command: ["node", "src/relay.ts"]
  collector:
    platform: linux/arm64
    image: albireo-stack-collector:0.165.0-security1
    build:
      context: ../..
      dockerfile: infra/images/collector.Dockerfile
      target: stack
    ports:
      - "127.0.0.1:43429:4318"
